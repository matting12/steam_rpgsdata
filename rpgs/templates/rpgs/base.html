<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Top 10 Steam RPGs{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1b2838; color: #c7d5e0; margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; margin: 0; }
    a { color: #66c0f4; text-decoration: none; }
    ol { list-style: none; padding: 0; margin: 20px 0; }
    .top-pick { background: #2a475e; padding: 12px 14px; border-radius: 4px; margin: 16px 0 0; }
    .game { display: flex; align-items: center; gap: 14px; background: #16202d;
            margin-bottom: 8px; padding: 8px 14px 8px 8px; border-radius: 4px; }
    .rank { width: 28px; text-align: center; font-weight: 700; color: #8f98a0; }
    .game img, .placeholder { width: 120px; height: 45px; object-fit: cover; border-radius: 2px; flex: none; }
    .placeholder { background: #2a475e; }
    .title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .details { font-size: .8rem; color: #8f98a0; }
    .price { text-align: right; white-space: nowrap; min-width: 90px; }
    .discount { background: #4c6b22; color: #a4d007; padding: 2px 6px; margin-right: 6px; }
    .error { background: #5c1f1f; padding: 12px; border-radius: 4px; }
  </style>
</head>
<body>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
